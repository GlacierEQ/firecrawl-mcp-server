name: Deploy Images to GHCR staging

env:
  DOTNET_VERSION: '6.0.x'

on:
  push:
    branches:
      - staging
      - fastmcp
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-image:
    runs-on: ubuntu-latest
    steps:

      - name: 'Checkout GitHub Action'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 'Build Service Image'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.service
          push: true
          tags: |
            ghcr.io/firecrawl/firecrawl-mcp-server-alpha:latest
            ghcr.io/firecrawl/firecrawl-mcp-server-alpha:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/firecrawl/firecrawl-mcp-server-alpha:latest
          cache-to: type=inline
